[package]
name = "fraudshield-wasm"
version = "1.0.0"
authors = ["FraudShield Uganda <sseguya256@gmail.com>"]
edition = "2021"
description = "WebAssembly-powered fraud detection for microfinance institutions"
repository = "https://github.com/rryesuafuga/fraudshield-uganda"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.87"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3.64"
web-sys = { version = "0.3.64", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "FileReader",
    "File",
    "FileList",
    "Blob",
    "Event",
    "ProgressEvent",
]}
console_error_panic_hook = { version = "0.1.7", optional = true }
wee_alloc = { version = "0.4.5", optional = true }
csv = "1.3"
regex = "1.10"

[dev-dependencies]
wasm-bindgen-test = "0.3.37"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]
