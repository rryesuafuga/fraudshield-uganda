<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FraudShield Uganda</title>
    <meta name="description" content="Reset your FraudShield Uganda password.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(71, 85, 105, 0.5); }
        .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white flex flex-col">
    <!-- Header -->
    <header class="border-b border-slate-700/50 bg-slate-900/80 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-lg flex items-center justify-center">
                        <i data-lucide="shield-check" class="h-6 w-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold">FraudShield Uganda</h1>
                        <p class="text-xs text-slate-400">Fraud Detection Platform</p>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Reset Password Card -->
            <div class="card rounded-2xl p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-amber-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="key" class="h-8 w-8 text-amber-400"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Reset Password</h2>
                    <p class="text-slate-400">Enter your email to receive a reset link</p>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-lg">
                    <div class="flex items-start space-x-3">
                        <i data-lucide="x-circle" class="h-5 w-5 text-red-400 flex-shrink-0 mt-0.5"></i>
                        <p id="error-text" class="text-sm text-red-400"></p>
                    </div>
                </div>

                <!-- Success Message -->
                <div id="success-message" class="hidden mb-6 p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-lg">
                    <div class="flex items-start space-x-3">
                        <i data-lucide="check-circle" class="h-5 w-5 text-emerald-400 flex-shrink-0 mt-0.5"></i>
                        <div>
                            <p id="success-text" class="text-sm text-emerald-400 font-medium">Reset link sent!</p>
                            <p class="text-xs text-slate-400 mt-1">Check your email inbox (and spam folder) for the reset link.</p>
                        </div>
                    </div>
                </div>

                <!-- Reset Form -->
                <form id="reset-form" onsubmit="handleReset(event)">
                    <div class="space-y-4">
                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-500"></i>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                    placeholder="you@example.com"
                                    class="input-field w-full pl-10 pr-4 py-3 rounded-lg text-white placeholder-slate-500"
                                >
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            id="submit-btn"
                            class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 rounded-lg font-semibold text-white transition-colors flex items-center justify-center space-x-2"
                        >
                            <span>Send Reset Link</span>
                            <i data-lucide="send" class="h-5 w-5"></i>
                        </button>
                    </div>
                </form>

                <!-- Back to Login -->
                <div class="mt-6 text-center">
                    <a href="index.html" class="text-slate-400 hover:text-white text-sm flex items-center justify-center space-x-2">
                        <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        <span>Back to Login</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-700/50 py-4">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
            <p>&copy; 2025 FraudShield Uganda</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/supabase.js"></script>
    <script>
        lucide.createIcons();

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        function showSuccess() {
            document.getElementById('success-message').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }

        async function handleReset(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div><span class="ml-2">Sending...</span>';

            const { error } = await window.FraudShieldAuth.resetPassword(email);

            if (error) {
                showError(error.message || 'Failed to send reset email');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Send Reset Link</span><i data-lucide="send" class="h-5 w-5"></i>';
                lucide.createIcons();
                return;
            }

            showSuccess();
            document.getElementById('reset-form').classList.add('opacity-50', 'pointer-events-none');
        }
    </script>
</body>
</html>
